#!/usr/sbin/nft -f
#
# nftables ruleset for a NetSentinel host.
#
# Installation:
#   sudo cp deploy/firewall/nftables.conf /etc/nftables.conf
#   sudo nft -f /etc/nftables.conf
#
# This is a starter ruleset, not production-hardened. It assumes:
#   - Apache listens on 80/443, fronting Node on 127.0.0.1:3000
#   - SSH on 22
#   - A default DROP policy on input and forward
#
# The commented sections show where NetSentinel's own traffic lands
# so you can reason about capture vs firewall:

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Loopback (NetSentinel capture on `lo` sees this traffic).
        iif lo accept

        # Established/related (responses to outbound). NetSentinel
        # sees both directions but the firewall only gates the
        # inbound path.
        ct state established,related accept
        ct state invalid drop

        # SSH from anywhere (tighten in prod: `iif eth0 ip saddr 10.0.0.0/8`).
        tcp dport 22 accept

        # HTTP → redirect to HTTPS (Apache handles the redirect).
        tcp dport 80 accept
        # HTTPS → Apache → proxy_pass to 127.0.0.1:3000 (Node).
        tcp dport 443 accept

        # NOTE: nothing here exposes 3000 externally. Node binds to
        # 127.0.0.1:3000 (via Apache) or 0.0.0.0:3000 (via Docker
        # with loopback port binding). If you run Node directly
        # without Apache, uncomment:
        # tcp dport 3000 ip saddr 127.0.0.1 accept

        # ICMP — needed for PMTUD; NetSentinel counts these as icmp_packets.
        icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
        icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

        # Anything else: drop (and count). NetSentinel sees the
        # DROP decision only after the kernel has already routed the
        # packet — the capture socket sees both accepted and dropped
        # packets, because AF_PACKET taps before netfilter.
        counter drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}