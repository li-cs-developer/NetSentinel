# /etc/apache2/sites-available/netsentinel.conf
#
# Prerequisites on Ubuntu:
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers ssl rewrite
#   sudo a2ensite netsentinel
#   sudo systemctl reload apache2
#
# Requires a TLS certificate. For local testing, use a self-signed cert;
# in production use Certbot / Let's Encrypt.

<VirtualHost *:80>
    ServerName netsentinel.example.com
    # Redirect all HTTP to HTTPS.
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName netsentinel.example.com

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/netsentinel.example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/netsentinel.example.com/privkey.pem

    # ── Security headers ────────────────────────────────────────
    # These complement the CSP that the Node server itself sets.
    # Apache's Header directive can override; we're only adding
    # transport-level headers the Node process can't set.
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"

    # ── WebSocket upgrade — MUST come before the generic / proxy ─
    # The `upgrade=websocket` flag and Connection header rewrite is
    # what makes mod_proxy tunnel the HTTP Upgrade. Without this,
    # the browser's WS handshake gets a 400 from Apache.
    ProxyPass        /ws ws://127.0.0.1:3000/ws
    ProxyPassReverse /ws ws://127.0.0.1:3000/ws
    <Location /ws>
        Require all granted
    </Location>

    # ── API ────────────────────────────────────────────────────
    ProxyPreserveHost On
    ProxyPass        /api http://127.0.0.1:3000/api
    ProxyPassReverse /api http://127.0.0.1:3000/api

    # ── Everything else → Node (dashboard SPA) ─────────────────
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # Slightly longer timeouts than default — WS connections can sit
    # idle for a while between snapshots.
    ProxyTimeout 300

    ErrorLog  ${APACHE_LOG_DIR}/netsentinel-error.log
    CustomLog ${APACHE_LOG_DIR}/netsentinel-access.log combined
</VirtualHost>